services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: devops-ev1:latest
    container_name: devops-ev1-api
    ports:
      - "5000:5000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s