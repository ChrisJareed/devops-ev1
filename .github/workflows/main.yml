name: CI/CD Pipeline - DevOps EV1

on:
  push:
    branches:
      - main
      - develop
      - feature/**
  pull_request:
    branches:
      - main
      - develop

jobs:
  quality:
    name: Lint y pruebas
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint con flake8
        run: |
          flake8 app.py tests/ --max-line-length=100 --statistics

      - name: Ejecutar pruebas unitarias
        run: |
          pytest tests/ -v --tb=short

  docker-build:
    name: Construccion de imagen Docker
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Construir imagen Docker
        run: |
          docker build -t devops-ev1:${{ github.sha }} .

  deploy-simulado:
    name: Despliegue simulado con Docker Compose
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Levantar entorno simulado
        run: |
          docker compose up -d --build

      - name: Validar endpoint health
        run: |
          sleep 10
          curl --fail http://localhost:5000/health

      - name: Apagar entorno simulado
        if: always()
        run: |
          docker compose down
