name: CI/CD Pipeline - DevOps EV1

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
      - feature/**
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  id-token: write

jobs:
  quality:
    name: Lint, pruebas, cobertura y seguridad
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint con flake8
        run: |
          flake8 app.py tests/ --max-line-length=100 --statistics

      - name: Ejecutar pruebas unitarias con cobertura
        run: |
          pytest tests/ -v --tb=short --cov=app --cov-report=xml --cov-report=term-missing

      - name: Exportar metricas de cobertura para Prometheus
        run: |
          python scripts/export_ci_metrics.py --coverage coverage.xml --output ci-metrics.prom --branch "${{ github.ref_name }}" --commit "${{ github.sha }}"

      - name: Publicar artefactos de cobertura y metricas
        uses: actions/upload-artifact@v4
        with:
          name: ci-metrics
          path: |
            coverage.xml
            ci-metrics.prom

      - name: Analisis de seguridad con Snyk
        uses: snyk/actions/python@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          args: --severity-threshold=high

  compliance:
    name: Auditoria automatizada de cumplimiento
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Ejecutar auditoria de cumplimiento
        run: |
          python scripts/audit_compliance.py

  kubernetes-validate:
    name: Validacion de manifiestos Kubernetes
    runs-on: ubuntu-latest
    needs: compliance

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Validar manifiestos Kubernetes
        run: |
          python scripts/validate_k8s_manifests.py

  docker-build:
    name: Construccion de imagen Docker
    runs-on: ubuntu-latest
    needs:
      - compliance
      - kubernetes-validate

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Construir imagen Docker
        run: |
          docker build -t devops-ev1:${{ github.sha }} .

  deploy-simulado:
    name: Despliegue simulado observable
    runs-on: ubuntu-latest
    needs:
      - docker-build

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Descargar metricas CI/CD
        uses: actions/download-artifact@v4
        with:
          name: ci-metrics
          path: artifacts/ci-metrics

      - name: Levantar entorno simulado con observabilidad
        run: |
          echo "$(date +%s)" > deploy-start.txt
          docker compose up -d --build

      - name: Validar endpoints, metricas y herramientas
        run: |
          retry_url() {
            name="$1"
            url="$2"
            attempts="${3:-30}"
            delay="${4:-5}"

            for attempt in $(seq 1 "$attempts"); do
              if curl --fail --silent --show-error "$url"; then
                echo "$name disponible"
                return 0
              fi

              echo "$name aun no esta disponible (intento $attempt/$attempts)."
              sleep "$delay"
            done

            echo "::error::$name no respondio correctamente en $url"
            docker compose ps
            docker compose logs --tail=120
            return 1
          }

          retry_url "API health" http://localhost:5000/health
          retry_url "API metrics" http://localhost:5000/metrics
          retry_url "Prometheus" http://localhost:9090/-/ready
          retry_url "Grafana" http://localhost:3000/api/health
          retry_url "Loki" http://localhost:3100/ready

      - name: Publicar metricas CI/CD en Pushgateway
        run: |
          start_time="$(cat deploy-start.txt)"
          end_time="$(date +%s)"
          deploy_duration="$((end_time - start_time))"
          python scripts/export_ci_metrics.py --coverage artifacts/ci-metrics/coverage.xml --deploy-duration "$deploy_duration" --output ci-metrics.prom --branch "${{ github.ref_name }}" --commit "${{ github.sha }}"
          curl --fail --data-binary @ci-metrics.prom http://localhost:9091/metrics/job/github_actions
          sleep 10
          curl --fail "http://localhost:9090/api/v1/query?query=devops_ev1_ci_test_coverage_percent"
          curl --fail "http://localhost:9090/api/v1/query?query=devops_ev1_ci_deploy_duration_seconds"

      - name: Apagar entorno simulado
        if: always()
        run: |
          docker compose down

  push-ecr:
    name: Publicar imagen en Amazon ECR
    runs-on: ubuntu-latest
    needs:
      - deploy-simulado
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    env:
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

    steps:
      - name: Omitir publicacion AWS no configurada
        if: env.AWS_ROLE_TO_ASSUME == ''
        run: |
          echo "AWS_ROLE_TO_ASSUME no esta configurado; se omite la publicacion en ECR."

      - name: Checkout del codigo
        if: env.AWS_ROLE_TO_ASSUME != ''
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        if: env.AWS_ROLE_TO_ASSUME != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login en Amazon ECR
        if: env.AWS_ROLE_TO_ASSUME != ''
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Crear repositorio ECR si no existe
        if: env.AWS_ROLE_TO_ASSUME != ''
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" || aws ecr create-repository --repository-name "$ECR_REPOSITORY" --image-scanning-configuration scanOnPush=true

      - name: Construir y publicar imagen
        if: env.AWS_ROLE_TO_ASSUME != ''
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

  deploy-eks:
    name: Despliegue en AWS EKS
    runs-on: ubuntu-latest
    needs:
      - push-ecr
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    env:
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}

    steps:
      - name: Omitir despliegue AWS no configurado
        if: env.AWS_ROLE_TO_ASSUME == ''
        run: |
          echo "AWS_ROLE_TO_ASSUME no esta configurado; se omite el despliegue en EKS."

      - name: Checkout del codigo
        if: env.AWS_ROLE_TO_ASSUME != ''
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        if: env.AWS_ROLE_TO_ASSUME != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login en Amazon ECR
        if: env.AWS_ROLE_TO_ASSUME != ''
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Instalar kubectl
        if: env.AWS_ROLE_TO_ASSUME != ''
        uses: azure/setup-kubectl@v4

      - name: Configurar acceso a EKS
        if: env.AWS_ROLE_TO_ASSUME != ''
        run: |
          aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"

      - name: Desplegar manifiestos en EKS
        if: env.AWS_ROLE_TO_ASSUME != ''
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          kubectl apply -f k8s/
          kubectl set image deployment/devops-ev1-api api="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" -n devops-ev1
          kubectl rollout status deployment/devops-ev1-api -n devops-ev1 --timeout=180s

      - name: Validar health y metricas en EKS
        if: env.AWS_ROLE_TO_ASSUME != ''
        run: |
          kubectl port-forward svc/devops-ev1-service 5000:80 -n devops-ev1 > port-forward.log 2>&1 &
          sleep 10
          curl --fail http://localhost:5000/health
          curl --fail http://localhost:5000/metrics
