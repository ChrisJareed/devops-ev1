global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: devops-ev1-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - api:5000

  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080

  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets:
          - pushgateway:9091
