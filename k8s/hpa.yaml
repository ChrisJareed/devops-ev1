apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: devops-ev1-api
  namespace: devops-ev1
  labels:
    app.kubernetes.io/name: devops-ev1
    app.kubernetes.io/component: api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: devops-ev1-api
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
